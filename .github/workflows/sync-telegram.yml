name: Sync Official Telegram (Safe Branding)

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Izugram (rewrite)
        uses: actions/checkout@v4
        with:
          ref: rewrite
          fetch-depth: 0
          persist-credentials: false

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge Official Telegram & Protect Files
        run: |
          git checkout -B telegram-update
          git fetch "https://github.com" master
          git merge FETCH_HEAD --allow-unrelated-histories --no-commit --no-ff || true
          git checkout --ours .github/ gradle.properties tlrpc-patch.py TMessagesProj/build.gradle TMessagesProj/google-services.json || true
          git checkout --ours TMessagesProj/src/main/res/mipmap-*/ || true
          git checkout --theirs TMessagesProj/jni/ || true
          git add -A
          git commit -m "WIP: Update Telegram base (Branding & AyuGram protected)" || true

      - name: Push telegram-update Branch
        run: |
          git push "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@://github.com{{ github.repository }}.git" telegram-update --force

      - name: Create Pull Request via GitHub CLI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr create --base rewrite --head telegram-update --title "Safe Update: Latest Official Telegram Base" --body "Pulls latest DrKLO/Telegram into telegram-update while protecting custom files." || echo "PR already exists"
