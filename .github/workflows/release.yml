name: Build Izugram APK

on:
  push:
    branches:
      - rewrite
  workflow_dispatch:

concurrency:
  group: izugram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The upstream proprietary submodule is private and is replaced
          # by local compile-compatible stubs in this repository.
          submodules: false
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Create API_KEYS
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_STORE_PASSWORD"
          {
            printf 'APP_ID = 27171616\n'
            printf 'APP_HASH = "b96a7b000e52a02f5eca8730676dbee0"\n'
            printf 'MAPS_V2_API = ""\n'
            printf 'SIGNING_KEY_PASSWORD = %s\n' "$SIGNING_KEY_PASSWORD"
            printf 'SIGNING_KEY_ALIAS = %s\n' "$SIGNING_KEY_ALIAS"
            printf 'SIGNING_KEY_STORE_PASSWORD = %s\n' "$SIGNING_KEY_STORE_PASSWORD"
          } > API_KEYS

      - name: Verify signing keystore
        run: test -s TMessagesProj/config/izugram-release.jks

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Izugram release
        run: ./gradlew --no-daemon --stacktrace assembleAfatRelease

      - name: Upload Izugram APK
        uses: actions/upload-artifact@v4
        with:
          name: Izugram-Release-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
