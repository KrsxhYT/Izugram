name: Build Izugram APK

on:
  push:
    branches:
      - rewrite
  workflow_dispatch:

concurrency:
  group: izugram-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The upstream proprietary submodule is private and is replaced
          # by local compile-compatible stubs in this repository.
          submodules: false
          fetch-depth: 0

      - name: Free disk space for Android native build
        shell: bash
        run: |
          set -euo pipefail
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost
          sudo rm -rf /usr/local/lib/android/sdk/system-images /usr/local/lib/android/sdk/emulator
          sudo apt-get clean
          df -h /

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK command-line tools
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the obsolete "tools" package.
          # Install platform-tools here; pinned build packages are installed below.
          packages: platform-tools

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --licenses < /dev/null
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;33.0.1" \
            "ndk;21.4.7075529" \
            "cmake;3.22.1"

      - name: Apply Izugram package and branding
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          import shutil

          root = Path.cwd()
          java_root = root / "TMessagesProj/src/main/java"
          old_package = "com.radolyn.ayugram"
          new_package = "com.krsxh.izugram"

          # Update every source/import/config reference, then move the source tree.
          text_suffixes = {".java", ".kt", ".xml", ".gradle", ".properties", ".md", ".txt", ".yml", ".yaml", ".json", ".pro", ".cfg"}
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in text_suffixes:
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old_package, new_package)
              updated = updated.replace("com/radolyn/ayugram", "com/krsxh/izugram")
              if path.suffix == ".xml":
                  # Update user-facing resource text in every locale while preserving
                  # resource names, IDs, attributes, and XML structure.
                  updated = re.sub(
                      r">([^<>]*)<",
                      lambda m: ">" + re.sub(r"(?i)AyuGram", "Izugram", m.group(1)) + "<",
                      updated,
                  )
              elif path.suffix == ".md":
                  updated = re.sub(r"(?i)AyuGram", "Izugram", updated)
              if path.suffix in {".java", ".kt"}:
                  updated = re.sub(r"(?<![A-Za-z0-9_])AyuGram(?![A-Za-z0-9_])", "Izugram", updated)
              if updated != text:
                  path.write_text(updated, encoding="utf-8")

          old_dir = java_root / "com/radolyn/ayugram"
          new_dir = java_root / "com/krsxh/izugram"
          if old_dir.exists():
              new_dir.parent.mkdir(parents=True, exist_ok=True)
              if new_dir.exists():
                  shutil.copytree(old_dir, new_dir, dirs_exist_ok=True)
                  shutil.rmtree(old_dir)
              else:
                  shutil.move(str(old_dir), str(new_dir))

          # Keep Room schema package paths aligned with the migrated Java package.
          old_schema = root / "TMessagesProj/schemas/com.radolyn.ayugram.database.AyuDatabase"
          new_schema = root / "TMessagesProj/schemas/com.krsxh.izugram.database.AyuDatabase"
          if old_schema.exists() and not new_schema.exists():
              old_schema.rename(new_schema)
          PY

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bison gcc make curl ninja-build ccache

      - name: Create API_KEYS
        env:
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_STORE_PASSWORD: ${{ secrets.SIGNING_KEY_STORE_PASSWORD }}
        run: |
          test -n "$SIGNING_KEY_PASSWORD"
          test -n "$SIGNING_KEY_ALIAS"
          test -n "$SIGNING_KEY_STORE_PASSWORD"
          {
            printf 'APP_ID = 27171616\n'
            printf 'APP_HASH = "b96a7b000e52a02f5eca8730676dbee0"\n'
            printf 'MAPS_V2_API = ""\n'
            printf 'SIGNING_KEY_PASSWORD = %s\n' "$SIGNING_KEY_PASSWORD"
            printf 'SIGNING_KEY_ALIAS = %s\n' "$SIGNING_KEY_ALIAS"
            printf 'SIGNING_KEY_STORE_PASSWORD = %s\n' "$SIGNING_KEY_STORE_PASSWORD"
          } > API_KEYS

      - name: Verify signing keystore
        run: test -s TMessagesProj/config/izugram-release.jks

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Build Izugram release
        run: ./gradlew --no-daemon --no-build-cache --no-configuration-cache --stacktrace assembleAfatRelease

      - name: Upload Izugram APK
        uses: actions/upload-artifact@v4
        with:
          name: Izugram-Release-APK
          path: TMessagesProj/build/outputs/apk/afat/release/*.apk
          if-no-files-found: error
